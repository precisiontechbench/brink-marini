  <text x="240" y="268" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-weight="700" font-size="40" textLength="440" lengthAdjust="spacingAndGlyphs" fill="#1F3A5F">Brink &amp; Marini Inc.</text>
